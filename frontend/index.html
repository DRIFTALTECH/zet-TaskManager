<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/brand/zet-icon.svg" />
    <title>ZET — Task workspace</title>
    <meta name="description" content="ZET — plan tasks, track time, and collaborate with your team." />
    <meta name="author" content="ZET" />

    <meta property="og:title" content="ZET" />
    <meta property="og:description" content="Plan tasks, track time, and collaborate with your team." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/brand/zet-icon.svg" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="/brand/zet-icon.svg" />
  </head>

  <body>
    <!--
      Inline splash, painted by the very first frame of this document.

      A browser keeps showing the PREVIOUS page until the new document has
      something to paint. With an empty #root that meant users returning from the
      Microsoft sign-in redirect kept staring at the Microsoft page while MSAL and
      the app chunk loaded, and concluded the login had failed. This markup makes
      the handover instant and says what is happening. React replaces it on mount.
    -->
    <style>
      #zet-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f5f5f5;
        color: #6b6b6b;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 14px;
      }
      @media (prefers-color-scheme: dark) {
        #zet-splash { background: #0a0a0a; color: #8a8a8a; }
      }
      #zet-splash .ring {
        width: 26px;
        height: 26px;
        border: 2px solid currentColor;
        border-top-color: transparent;
        border-radius: 50%;
        animation: zet-spin 0.7s linear infinite;
      }
      @keyframes zet-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #zet-splash .ring { animation-duration: 2s; }
      }
    </style>
    <div id="root">
      <div id="zet-splash">
        <div class="ring"></div>
        <p id="zet-splash-msg">Loading ZET…</p>
      </div>
    </div>
    <script>
      // Returning from the Microsoft redirect? Say so, so the wait reads as
      // progress rather than a failed login. MSAL puts code/state in the hash.
      (function () {
        var h = window.location.hash || "";
        var q = window.location.search || "";
        if (/[#&?](code|id_token|state|error)=/.test(h + q)) {
          var el = document.getElementById("zet-splash-msg");
          if (el) el.textContent = "Signing you in with Microsoft…";
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
